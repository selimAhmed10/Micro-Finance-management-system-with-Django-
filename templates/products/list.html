<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
</head>
<body>
    <h1>Product List</h1>
    <a href="{% url 'create_product' %}">Add New Product</a>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Amount</th>
                <th>Interest Rate (%)</th>
                <th>Total Installments</th>
                <th>Per Install Amount</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for p in product %}
            <tr>
                <td>{{ p.id }}</td>
                <td>{{ p.name }}</td>
                <td>{{ p.amount }}</td>
                <td>{{ p.interest_rate }}%</td>
                <td>{{ p.total_installment }}</td>
                <td>{{ p.per_install_amount }}</td>
                <td>
                    <a href="{% url 'update_product' p.id %}">Edit</a>
                    <a href="{% url 'delete_product' p.id %}" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
         
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
