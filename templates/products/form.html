<!DOCTYPE html>
<html>
<head>
    <title>product form</title>
</head>
<body>
    <h1>{% if product %}Edit Product{% else %}Add  Product{% endif %}</h1>

    <form method="post">
        {% csrf_token %}

        <p>
            <label>Product Name:</label><br>
            <input type="text" name="name" value="{{ product.name }}" required>
        </p>

        <p>
            <label>Amount:</label><br>
            <input type="number" step="0.01" name="amount" value="{{ product.amount }}" required>
        </p>

        <p>
            <label>Interest Rate (%):</label><br>
            <input type="number" step="0.01" name="interest_rate" value="{{ product.interest_rate }}" required>
        </p>

        <p>
            <label>Total Installments:</label><br>
            <input type="number" name="total_installment" value="{{ product.total_installment }}" required>
        </p>

        <p>
            <label>Per Installment Amount:</label><br>
            <input type="number" step="0.01" name="per_install_amount" value="{{ product.per_install_amount }}" required>
        </p>

        <button type="submit">Save</button>
        <a href="/products/view/">Cancel</a>
    </form>
</body>
</html>
