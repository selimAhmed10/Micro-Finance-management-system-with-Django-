<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if group %}Edit Group{% else %}Add Group{% endif %}</title>
</head>
<body>
    <h1>{% if group %}Edit Group{% else %}Add New Group{% endif %}</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <p>
            <label>Group name:</label><br>
            <input type="text" name="name" value="{{ group.name }}" required>
        </p>

        <p>
            <label>Location:</label><br>
            <input type="text" name="location" value="{{ group.location }}">
        </p>

        <p>
            <label>Assign Officer:</label><br>
            <select name="officer">
                <option value="">-- None --</option>
                {% for officer in officers %}
                    <option value="{{ officer.id }}" {% if group.officer and group.officer.id == officer.id %}selected{% endif %}>
                        {{ officer.name }} (ID: {{ officer.officer_id }})
                    </option>
                {% endfor %}
            </select>
        </p>

        <button type="submit">Save</button>
        <a href="/groups/">Cancel</a>
    </form>
</body>
</html>
