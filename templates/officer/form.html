<!DOCTYPE html>
<html>
<head>
    <title>Officer add form --</title>
</head>
<body>
    <h1>Oficer Form</h1>

    <form method="post">
        {% csrf_token %}

        {% if not officer %}
        <p>
            <label>Username:</label><br>
            <input type="text" name="username" required>
        </p>

        <p>
            <label>Password:</label><br>
            <input type="password" name="password" required>
        </p>
        {% endif %}

        <p>
            <label>Officer ID:</label><br>
            <input type="text" name="officer_id" value="{{ officer.officer_id }}" required>
        </p>

        <p>
            <label>Full Name:</label><br>
            <input type="text" name="name" value="{{ officer.name }}" required>
        </p>

        <p>
            <label>NID Number:</label><br>
            <input type="text" name="nid" value="{{ officer.nid }}" required>
        </p>

        <p>
            <label>Phone Number:</label><br>
            <input type="text" name="phone" value="{{ officer.phone }}" required>
        </p>

        <p>
            <label>Address:</label><br>
            <textarea name="address" rows="4" cols="40" required>{{ officer.address }}</textarea>
        </p>

        <button type="submit">Save</button>
        <a href="/officer/view/">Cancel</a>
    </form>
</body>
</html>
