<!DOCTYPE html>
<html>
<head>
    <title>Borrower List</title>
</head>
<body>
    <h1>Borrower List</h1>
    
    <a href="/borrower/create/">+ Add New Borrower</a>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>NID</th>
                <th>Phone</th>
                <th>Group</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for borrower in borrowers %}
            <tr>
                <td>{{ borrower.id }}</td
                <td>{{ borrower.name }}</td
                <td>{{ borrower.nid }}</td
                <td>{{ borrower.phone }}</td
                <td>{{ borrower.group.name|default:"Not Assigned" }}</td
                <td>
                    <a href="/borrower/edit/{{ borrower.id }}/">Edit</a>
                    <a href="/borrower/delete/{{ borrower.id }}/" onclick="return confirm('Delete?')">Delete</a>
                </td
            </tr>
            
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
